[project]
name = "paper-factory"
version = "0.1.0"
description = "Human-in-the-loop GUI factory for the paper collection/evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24",
]

[project.scripts]
paper-factory = "paper_factory.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paper_factory", "paper_factory.ui"]
